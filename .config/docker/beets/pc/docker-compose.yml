services:
  beets:
    image: lscr.io/linuxserver/beets:latest
    container_name: beets
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /c/.config/beets:/config
      - /e/Music/:/music
      - /c/users/ok/Downloads/beets:/downloads
    ports:
      - 8337:8337
    restart: unless-stopped
